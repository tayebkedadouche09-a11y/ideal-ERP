name: IDEAIL capability smoke tests

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout IDEAIL ERP
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --upgrade pytest

      - name: Compile IDEAIL capability layer
        run: python -m compileall -q buildsuite_core/ideal_erp buildsuite_core/api/ideal_erp.py

      - name: Run IDEAIL capability tests
        run: python -m pytest -q buildsuite_core/ideal_erp/tests/test_core.py
